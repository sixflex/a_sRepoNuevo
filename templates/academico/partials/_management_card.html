{# Tarjeta de acceso de Gestión académica. Uso: include con title, description, url_name y button_text. #}
<div class="col-12 col-md-6 col-xl-3">
    <div class="card shadow-sm border-0 h-100">
        <div class="card-body p-4 d-flex flex-column">
            <h3 class="h5 fw-bold">{{ title }}</h3>
            <p class="text-muted flex-grow-1">{{ description }}</p>
            <a href="{% url url_name %}" class="btn btn-rojo w-100">
                {{ button_text }}
            </a>
        </div>
    </div>
</div>
