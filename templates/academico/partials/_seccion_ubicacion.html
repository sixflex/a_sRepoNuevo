<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white border-bottom py-3">
        <h2 class="h5 fw-bold mb-0">Ubicación académica</h2>
    </div>
    <div class="card-body p-4">
        <dl class="ficha-datos">
            <div class="dato">
                <dt>Sede</dt>
                <dd>{{ seccion.campus.sede.nombre }}</dd>
            </div>
            <div class="dato">
                <dt>Campus</dt>
                <dd>{{ seccion.campus.nombre }}</dd>
            </div>
            <div class="dato">
                <dt>Ciudad</dt>
                <dd>{{ seccion.campus.sede.ciudad|default:"No registrada" }}</dd>
            </div>
            <div class="dato dato--ancho">
                <dt>Dirección</dt>
                <dd>{{ seccion.campus.direccion|default:"No registrada" }}</dd>
            </div>
        </dl>
    </div>
</div>
