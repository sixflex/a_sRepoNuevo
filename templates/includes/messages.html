{# Mensajes de Django (éxito, error, aviso). Se incluye UNA sola vez, desde base.html. #}
{% if messages %}
<div class="mb-3" aria-live="polite">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi {% if message.tags == 'success' %}bi-check-circle{% elif message.tags == 'error' or message.tags == 'warning' %}bi-exclamation-triangle{% else %}bi-info-circle{% endif %} me-2" aria-hidden="true"></i>
            <div>{{ message }}</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar aviso"></button>
        </div>
    {% endfor %}
</div>
{% endif %}
