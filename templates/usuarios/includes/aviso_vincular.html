{# Aviso para vincular la otra cuenta institucional. Solo en el Inicio de Coordinador y Docente. #}
{% if aviso_vincular %}
<div class="alert alert-info d-flex align-items-center gap-2 mb-3" role="status">
    <i class="bi bi-link-45deg fs-5" aria-hidden="true"></i>
    <div class="flex-grow-1">
        {{ aviso_vincular }}
        <a href="{% url 'usuarios:cuenta' %}" class="alert-link ms-1">Ir a Mi cuenta</a>
    </div>
    <form method="post" action="{% url 'usuarios:ocultar_aviso_vincular' %}" class="m-0">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="btn-close" aria-label="No volver a mostrar este aviso"></button>
    </form>
</div>
{% endif %}
