<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación de Planificación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <h3 class="mb-4 text-primary fw-bold">Validación de Planificación Académica (RF-ACA-04)</h3>

    <!-- Formulario para Enviar Enlace -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold">Cargar Nueva Planificación por Enlace</div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-5">
                        <label class="form-label">Enlace de Planificación</label>
                        <input type="url" name="enlace_planificacion" class="form-control" placeholder="https://docs.google.com/..." required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Unidad Académica</label>
                        <input type="text" name="unidad" class="form-control" value="Departamento de Informática" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Período</label>
                        <input type="text" name="periodo" class="form-control" value="2026-10" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Validar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    {% if resumen %}
    <div class="card border-info mb-4 shadow-sm">
        <div class="card-header bg-info text-white fw-bold">Resultado de la Carga #{{ resumen.id }}</div>
        <div class="card-body">
            <div class="row text-center g-3">
                <div class="col-2">Recibidas: <strong>{{ resumen.filas_recibidas }}</strong></div>
                <div class="col-2">Aceptadas: <strong class="text-success">{{ resumen.filas_aceptadas }}</strong></div>
                <div class="col-2">Observadas: <strong class="text-danger">{{ resumen.filas_observadas }}</strong></div>
            </div>
        </div>
    </div>
    {% endif %}
</div>
</body>
</html>
