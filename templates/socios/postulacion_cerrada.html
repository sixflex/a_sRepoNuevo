{% extends "base.html" %}

{% block content_public %}

    <div class="card-ua p-4 p-md-5">
        <div class="mb-3">
            <i class="bi bi-calendar-x text-warning" style="font-size: 3.5rem;"></i>
        </div>
        <h3 class="fw-bold mb-2">Convocatoria Fuera de Plazo</h3>
        <p class="text-muted mb-4">
            {{ mensaje|default:"ha cerrado su período de postulación" }}
        </p>
        <a href="/" class="btn btn-ua px-4">Volver al Inicio</a>
    </div>
</div>
{% endblock %}
