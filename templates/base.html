<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal A+S{% endblock %}</title>
    <!-- Bootstrap 5.3 CSS e Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root { --sidebar-width: 250px; }
        body { min-width: 360px; background-color: #f8f9fa; }
        @media (min-width: 992px) {
            .sidebar-desktop {
                width: var(--sidebar-width);
                position: fixed;
                top: 56px;
                bottom: 0;
                left: 0;
                z-index: 100;
                overflow-y: auto;
            }
            .main-content-with-sidebar { margin-left: var(--sidebar-width); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    {% block navbar %}
        {% include 'components/navbar.html' %}
    {% endblock %}

    <div class="container-fluid flex-grow-1 p-0">
        <div class="row g-0">
            {% block sidebar %}{% endblock %}
            
            <main class="col p-3 p-md-4 {% block main_class %}{% endblock %}">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
